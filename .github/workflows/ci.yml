name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # SSH agent sign-in on each platform, against an in-process server (tests/agent.rs).
      - name: SSH agent (ssh-agent socket)
        if: runner.os != 'Windows'
        run: cargo test -p switchyard-remote --test agent -- --ignored
      - name: SSH agent (OpenSSH agent service, Pageant)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          # PuTTY 0.85 Pageant, pinned to the SHA-256 PuTTY publishes in its sha256sums.
          $exe = Join-Path $env:RUNNER_TEMP 'pageant.exe'
          Invoke-WebRequest https://the.earth.li/~sgtatham/putty/0.85/w64/pageant.exe -OutFile $exe
          $want = '3bd76b57fcd09acc948268c753ea2077b0c557ca435323301a9b572661f98ecd'
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $want) { throw 'pageant.exe hash mismatch' }
          $pageant = Start-Process $exe -PassThru
          Start-Sleep -Seconds 2
          try {
            cargo test -p switchyard-remote --test agent -- --ignored --test-threads 1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $pageant.Id -ErrorAction SilentlyContinue
          }

  integration:
    name: integration (PostgreSQL, SSH, tunnels, FTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The compose service, not a job service: it preloads pg_stat_statements, adds HypoPG
      # (docker/postgres-image) and seeds itself from docker/postgres.
      - name: Start PostgreSQL
        run: docker compose -f docker/compose.yml up -d --build --wait postgres
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Start SSH test servers
        run: sudo DIR=/tmp/switchyard-ssh scripts/ssh-test-servers.sh
      # Explicit TLS, implicit TLS and plain FTP (host network, for active mode), with a
      # certificate from a throwaway CA so verification stays on.
      - name: Start FTP test servers
        run: |
          scripts/ftp-test-certs.sh
          docker compose -f docker/compose.yml up -d ftp ftp-implicit ftp-plain
          for port in 2120 2121 2990; do
            for _ in $(seq 1 30); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              sleep 1
            done
            (exec 3<>/dev/tcp/127.0.0.1/$port) || { echo "FTP port $port is not listening"; exit 1; }
          done
      - run: cargo test -p switchyard-remote --test ftp -- --ignored --test-threads 1
        env:
          SWITCHYARD_FTP_CA: docker/ftp/ca.pem
      - run: cargo test -p switchyard-db --lib --test pg --test d1 -- --ignored --test-threads 1
      - run: cargo test -p switchyard-db --test activity -- --ignored --test-threads 1 postgres
      - run: cargo test -p switchyard-plan --test capture -- --ignored --test-threads 1 postgres
      - run: cargo test -p switchyard-plan --test access -- --ignored --test-threads 1 --skip sql_server
      - run: cargo test -p switchyard-cli --test cli -- --ignored --test-threads 1 --skip sql_server
      # Named targets: core's `integrated` test needs the Kerberos realm and SQL Server,
      # so it runs in the SQL Server job.
      - run: >-
          cargo test -p switchyard-core -p switchyard-remote --lib
          --test flow --test ftp_files --test pg_edits --test session_context --test ssh_files --test ssh_forwards
          --test ssh_terminal --test tunnel_pg --test ssh
          -- --ignored --test-threads 1
        env:
          SWITCHYARD_SSH_KEYS: /tmp/switchyard-ssh
      - name: FTP server state and logs
        if: failure()
        run: |
          docker compose -f docker/compose.yml ps -a
          docker compose -f docker/compose.yml logs --no-color --timestamps ftp ftp-implicit ftp-plain | tail -n 300

  integration-other:
    name: integration (MySQL, MongoDB, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # MySQL seeds itself from docker/mysql; MongoDB and Redis start empty.
      - name: Start MySQL, MongoDB and Redis
        run: docker compose -f docker/compose.yml up -d --wait mysql mongo redis
      - run: cargo test -p switchyard-db --test mysql -- --ignored --test-threads 1
      - run: cargo test -p switchyard-db --test mongo -- --ignored --test-threads 1
      - run: cargo test -p switchyard-db --test redis -- --ignored --test-threads 1

  integration-oracle:
    name: integration (Oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start Oracle Database Free
        run: docker compose -f docker/compose.yml --profile oracle up -d --wait oracle
      # Ubuntu 24.04 renamed libaio; Oracle documents the link.
      - name: Install libaio
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
      # The archive and hash the Driver Manager installs (crates/drivers/manifest.json).
      - name: Oracle Instant Client
        run: |
          curl -fsSL -o /tmp/ic.zip https://download.oracle.com/otn_software/linux/instantclient/2326000/instantclient-basic-linux.x64-23.26.0.0.0.zip
          echo "d6c79cbcf0ff209363e779855c690d4fc730aed847e9198a2c439bcf34760af5  /tmp/ic.zip" | sha256sum -c
          unzip -q /tmp/ic.zip -d /tmp/ic
          echo "IC=/tmp/ic/instantclient_23_26" >> "$GITHUB_ENV"
      - run: cargo test -p switchyard-db --test oracle -- --ignored --test-threads 1
        env:
          LD_LIBRARY_PATH: ${{ env.IC }}
          SWITCHYARD_ORACLE_CLIENT: ${{ env.IC }}

  smoke-compose:
    name: smoke (compose SQL Server, SSH, S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # `mssql-tls` writes the test CA first; the seed is a one-shot container.
      - name: Start SQL Server, OpenSSH and LocalStack
        run: |
          docker compose -f docker/compose.yml up -d --wait mssql localstack
          docker compose -f docker/compose.yml up -d ssh
          docker compose -f docker/compose.yml run --rm mssql-seed
      - run: cargo test -p switchyard-db --test smoke_mssql -- --ignored
      - run: cargo test -p switchyard-remote --test smoke_ssh -- --ignored
      - run: cargo test -p switchyard-remote --test s3 -- --ignored
        env:
          SWITCHYARD_S3_ENDPOINT: http://127.0.0.1:4566

  integration-s3:
    name: integration (S3 / LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start LocalStack (S3)
        run: docker compose -f docker/compose.yml up -d --wait localstack
      - run: cargo test -p switchyard-remote --test s3 -- --ignored --test-threads 1
        env:
          SWITCHYARD_S3_ENDPOINT: http://127.0.0.1:4566


  integration-mssql:
    name: integration (SQL Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Start SQL Server
        run: DIR=/tmp/switchyard-mssql scripts/mssql-test-server.sh
      - run: cargo test -p switchyard-db --test mssql -- --ignored --test-threads 1
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - run: cargo test -p switchyard-db --test activity -- --ignored --test-threads 1 sql_server
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - run: cargo test -p switchyard-plan --test capture -- --ignored --test-threads 1 sql_server
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - run: cargo test -p switchyard-plan --test access -- --ignored --test-threads 1 sql_server
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - run: cargo test -p switchyard-cli --test cli -- --ignored --test-threads 1 sql_server
        env:
          SWITCHYARD_MSSQL_CA: /tmp/switchyard-mssql/ca.pem
      - name: Kerberos test realm
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends krb5-kdc krb5-admin-server krb5-user
          echo "127.0.0.1 db.switchyard.test" | sudo tee -a /etc/hosts
          # Through a file, not a pipe, so a failing script fails the step.
          scripts/kerberos-test-kdc.sh start > /tmp/krb5-env
          sed 's/^export //; s/"//g' /tmp/krb5-env >> "$GITHUB_ENV"
      - name: GSSAPI (runtime-loaded) against the test KDC
        run: cargo test -p switchyard-drivers --test gssapi -- --ignored --test-threads 1
      - name: Integrated auth through core to SQL Server
        run: cargo test -p switchyard-core --test integrated -- --ignored --test-threads 1
        env:
          SSL_CERT_FILE: /tmp/switchyard-mssql/ca.pem
          SSL_CERT_DIR: /nonexistent
