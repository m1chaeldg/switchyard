name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.8, defaults to tag or Cargo.toml version)'
        required: false
        type: string
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev libssl-dev pkg-config
      - name: Run workspace tests
        run: cargo test --workspace

  build-linux:
    name: package (Linux x86_64)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: GPUI and packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev libx11-xcb-dev libssl-dev
      - name: Build AppImage package
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          SWITCHYARD_ENTRA_CLIENT_ID: ${{ vars.SWITCHYARD_ENTRA_CLIENT_ID }}
        run: bash packaging/linux/build-appimage.sh
      - name: Generate Linux checksums and archives
        run: |
          mkdir -p release-assets
          cp dist/*.AppImage release-assets/ 2>/dev/null || true
          cd release-assets
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*
          retention-days: 7

  build-windows:
    name: package (Windows x64)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-windows-release
      - name: Install NSIS
        run: |
          function Find-Makensis {
            @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $makensis = Find-Makensis
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = Find-Makensis
          }
          if (-not $makensis) {
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $makensis = Find-Makensis
          }
          if (-not $makensis) { throw 'NSIS installation failed: makensis.exe not found.' }
          & $makensis /VERSION
      - name: Compile release executables and installer
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          SWITCHYARD_ENTRA_CLIENT_ID: ${{ vars.SWITCHYARD_ENTRA_CLIENT_ID }}
          SWITCHYARD_UPDATE_PUBKEY: ${{ vars.SWITCHYARD_UPDATE_PUBKEY }}
        run: ./packaging/windows/build-windows.ps1
      - name: Generate Windows checksums
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem dist/* -File | ForEach-Object {
            Copy-Item $_.FullName -Destination release-assets/
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "release-assets/$($_.Name).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          retention-days: 7

  build-macos:
    name: package (macOS Universal)
    needs: test
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS DMG
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_INCREMENTAL: '0'
          MIN_MACOS: '11.0'
        run: bash packaging/macos/build-macos.sh
      - name: Generate macOS checksums
        run: |
          mkdir -p release-assets
          cp dist/*.dmg release-assets/ 2>/dev/null || true
          cp dist/*.pkg release-assets/ 2>/dev/null || true
          cd release-assets
          for f in *; do
            if [ -f "$f" ]; then
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          retention-days: 7

  create-release:
    name: create and upload release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine tag and release name
        id: meta
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=Switchyard $TAG" >> "$GITHUB_OUTPUT"
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@c062e08bd5328157348241fa9c7009186c63adec # v2.0.5
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: all-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
