# Test services for integration tests: `docker compose -f docker/compose.yml up -d`
# then `cargo test --workspace -- --ignored`. Credentials here are test-only.
name: switchyard-test

services:
  postgres:
    # postgres:16 plus HypoPG (docker/postgres-image/Dockerfile).
    build: ./postgres-image
    image: switchyard-test-postgres:16-hypopg
    environment:
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: shop
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["5432:5432"]
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d shop"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Writes a throwaway CA and a localhost certificate to docker/mssql/tls (once), so
  # clients verify the server against tls/ca.pem (docker/mssql/make-tls.sh).
  mssql-tls:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    volumes:
      - ./mssql:/work
    entrypoint: ["/bin/bash", "/work/make-tls.sh"]
    restart: "no"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql-tls:
        condition: service_completed_successfully
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Switchyard!2026"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes:
      - ./mssql:/seed:ro
      - ./mssql/tls:/var/opt/mssql/tls:ro
      - ./mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Switchyard!2026' -Q 'select 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./mssql:/seed:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'Switchyard!2026' -i /seed/seed.sql"]
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: switchyard
      MYSQL_DATABASE: shop
      MYSQL_USER: switchyard
      MYSQL_PASSWORD: switchyard
    ports: ["3306:3306"]
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uswitchyard -pswitchyard -h127.0.0.1 -e 'select 1' shop"]
      interval: 2s
      timeout: 3s
      retries: 60

  oracle:
    # Oracle Database Free (gvenzl's image, mirrored on ghcr.io). Large, so it only starts
    # with `--profile oracle`. The tests also need Oracle Instant Client (see
    # crates/db/tests/oracle.rs).
    image: ghcr.io/gvenzl/oracle-free:23-slim-faststart
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: Switchyard1
      APP_USER: app
      APP_USER_PASSWORD: Switchyard1
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: switchyard
      MONGO_INITDB_ROOT_PASSWORD: switchyard
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: deploy
      USER_PASSWORD: switchyard
      PASSWORD_ACCESS: "true"
      PUBLIC_KEY_FILE: /config/seed/id_ed25519.pub
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports: ["2222:2222"]
    volumes:
      - ./ssh:/config/seed:ro

  # FTP servers (vsftpd). Run scripts/ftp-test-certs.sh first: it writes the TLS
  # certificate and its test CA into docker/ftp. Tests: crates/remote/tests/ftp.rs.
  # Explicit TLS (AUTH TLS) required, on 2121.
  # All three run vsftpd in the foreground: the image's default start backgrounds it and
  # watches a pid found with `pgrep | tail -1` (pidproxy), which can pick the wrong process.
  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "deploy|switchyard|/home/deploy"
    command:
      - vsftpd
      # The file first: options after it override its settings (background=YES).
      - /etc/vsftpd/vsftpd.conf
      - -obackground=NO
      - -opasv_min_port=21000
      - -opasv_max_port=21010
      - -opasv_address=localhost
      - -orsa_cert_file=/etc/ftp-tls/cert.pem
      - -orsa_private_key_file=/etc/ftp-tls/key.pem
      - -ossl_enable=YES
      - -oallow_anon_ssl=NO
      - -oforce_local_data_ssl=YES
      - -oforce_local_logins_ssl=YES
      - -ossl_tlsv1=NO
      - -ossl_sslv2=NO
      - -ossl_sslv3=NO
      - -ossl_ciphers=HIGH
    ports:
      - "2121:21"
      - "21000-21010:21000-21010"
    volumes:
      - ./ftp:/etc/ftp-tls:ro

  # Implicit TLS (FTPS) on 2990.
  ftp-implicit:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: "deploy|switchyard|/home/deploy"
    command:
      - vsftpd
      # The file first: options after it override its settings (background=YES).
      - /etc/vsftpd/vsftpd.conf
      - -obackground=NO
      - -olisten_port=990
      - -oimplicit_ssl=YES
      - -opasv_min_port=21011
      - -opasv_max_port=21019
      - -opasv_address=localhost
      - -orsa_cert_file=/etc/ftp-tls/cert.pem
      - -orsa_private_key_file=/etc/ftp-tls/key.pem
      - -ossl_enable=YES
      - -oforce_local_data_ssl=YES
      - -oforce_local_logins_ssl=YES
      - -ossl_tlsv1=NO
      - -ossl_sslv2=NO
      - -ossl_sslv3=NO
    ports:
      - "2990:990"
      - "21011-21019:21011-21019"
    volumes:
      - ./ftp:/etc/ftp-tls:ro

  # Plain FTP on 127.0.0.1:2120, on the host network so active mode works (the server
  # connects back to the client's address).
  ftp-plain:
    image: delfer/alpine-ftp-server:latest
    network_mode: host
    environment:
      USERS: "deploy|switchyard|/home/deploy"
    command:
      - vsftpd
      # The file first: options after it override its settings (background=YES).
      - /etc/vsftpd/vsftpd.conf
      - -obackground=NO
      - -olisten_address=127.0.0.1
      - -olisten_port=2120
      - -oconnect_from_port_20=NO
      - -opasv_min_port=21020
      - -opasv_max_port=21030
      - -opasv_address=127.0.0.1

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "switchyard", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "switchyard", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:latest
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

